<!doctype html><html lang="zh-CN"><meta charset="utf-8"><script src="/config-appearance.js"></script><link rel="stylesheet" href="/config-theme.css"><style>body{margin:0;font:14px system-ui;color:var(--text)}form{display:grid;gap:14px}label{display:grid;gap:7px}input:not([type=checkbox]){box-sizing:border-box;width:100%;padding:9px 11px;font:inherit;border:1px solid var(--border);border-radius:8px;background:var(--field);color:var(--text)}input[type=checkbox]{accent-color:var(--accent)}.toggle{display:flex;align-items:center;justify-content:space-between}.row{display:grid;grid-template-columns:1fr 110px;gap:14px}output{display:block;color:var(--muted);font-size:13px;margin-top:14px}</style><form><label class="toggle">连接 OBS<input id="enabled" type="checkbox" role="switch"></label><label>WebSocket 地址<input id="url" type="url" required></label><label>密码<input id="password" type="password" autocomplete="off"></label></form><output id="status" role="status">未连接</output><output id="saved" role="status">更改后自动保存</output><script type="module">
import {createClient,getSceneContext,createAutoSave} from '/sdk/streamui.js';
const client=createClient(),id=getSceneContext().pluginId,settings=client.settings('plugin',id),values=await settings.read();
const field=name=>document.getElementById(name),labels={pending:'等待保存…',saving:'正在保存…',saved:'已保存',error:'保存失败'};
const save=createAutoSave(patch=>settings.patch(patch),{onStatus:value=>field('saved').textContent=labels[value],onError:error=>field('saved').textContent=error.message});
field('enabled').checked=values.enabled??false;
function bind(name,key,read){
  const input=field(name),commit=immediate=>{if(input.checkValidity()){try{save.update({[key]:read()},immediate);}catch(error){field('saved').textContent=error.message;}}};
  if(input.type!=='checkbox')input.oninput=()=>commit(false);input.onchange=()=>commit(true);
}
bind('enabled','enabled',()=>field('enabled').checked);
const show=value=>{field('status').textContent=value.error??({connected:'已连接',connecting:'正在连接',reconnecting:'正在重连',disabled:'未连接',disconnected:'未连接'}[value.state]??value.state);};
client.onState(state=>{const status=state.plugins.find(plugin=>plugin.id===id)?.topics.status;if(status)show(status);});
client.on('plugin.'+id+'.status',show);
client.start();document.querySelector('form').onsubmit=event=>event.preventDefault();
addEventListener('pagehide',()=>{void save.flush().catch(()=>{});client.stop();});
field('url').value=values.url??'ws://127.0.0.1:4455';field('password').value=values.password??'';
bind('url','url',()=>field('url').value.trim());bind('password','password',()=>field('password').value);
</script></html>
